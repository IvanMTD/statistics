<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка статистики</title>
    <!-- Подключаем шрифт Merriweather (похож на Times New Roman, но современнее) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SheetJS для чтения Excel -->
    <script src="/js/xlsx.full.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <!-- Карточка -->
        <div id="mainCard" class="card shadow-lg p-4 transition-width" style="max-width: 500px; width: 100%;">
            <div class="card-body text-center">
                <!-- Заголовок в одну строку -->
                <h5 class="card-title mb-4 text-nowrap overflow-hidden text-truncate" title="Для проверки заполнения, загрузите файл статистики">
                    Для проверки заполнения, загрузите файл статистики
                </h5>
                
                <!-- Область загрузки -->
                <div id="uploadArea" class="mb-3">
                    <input class="form-control form-control-lg" type="file" id="fileInput" accept=".xlsx,.xls">
                </div>
                
                <!-- Кнопка проверить -->
                <button id="checkBtn" class="btn btn-primary btn-lg w-100 d-none">Проверить</button>
                
                <!-- Область результатов (изначально скрыта) -->
                <div id="resultArea" class="mt-4 text-start d-none">
                    <!-- Сюда будет вставлен результат -->
                </div>
            </div>
        </div>
    </div>

    <!-- Оверлей с загрузкой -->
    <div id="loadingOverlay" class="loading-overlay d-none">
        <div class="spinner-container">
            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Загрузка...</span>
            </div>
            <p class="mt-3 fw-bold">Обработка</p>
        </div>
    </div>
    
    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Универсальный движок формул Excel -->
    <script src="js/formula-engine.js"></script>
    <!-- Parser for rules -->
    <script src="js/parser.js"></script>
    <!-- Custom JS -->
    <script src="js/main.js"></script>
</body>
</html>
