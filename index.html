<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка статистики</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SheetJS для чтения Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow-lg p-4" style="max-width: 500px; width: 100%;">
            <div class="card-body text-center">
                <h5 class="card-title mb-4">Для проверки заполнения, загрузите файл статистики</h5>
                <div class="mb-3">
                    <input class="form-control form-control-lg" type="file" id="fileInput" accept=".xlsx,.xls">
                </div>
                <button id="checkBtn" class="btn btn-primary btn-lg w-100 d-none">Проверить</button>
                
                <div id="resultArea" class="mt-4 text-start d-none">
                    <h6 class="text-danger fw-bold mb-3">Результаты проверки:</h6>
                    <ul id="errorList" class="list-group list-group-flush"></ul>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/main.js"></script>
</body>
</html>
